<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Projeto ONG</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Cadastro do Colaborador</h1>
    </header>

    <nav class="menu">
   <button class="menu-toggle"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false">
    &#9776;
</button>
    <div class="menu-links">
        <a href="index.html">Início</a>

<div class="dropdown">
    <a href="projetos.html">Projetos</a>
    <div class="dropdown-conteudo">
       <a href="projetos.html#doacoes">Doações</a>
<a href="projetos.html#voluntariado">Voluntariado</a>
    </div>
</div>

<a href="cadastro.html">Cadastro</a>
    </div>
</nav>

    <main>
        <h2>Faça parte da nossa ONG</h2>
        <form>
            <fieldset>
                <legend>Dados pessoais</legend>
                
               <label for="nome">Nome completo (obrigatório):</label>
<input
    type="text"
    id="nome"
    name="nome"
    autocomplete="name"
    required
>

               <label for="email">E-mail (obrigatório):</label>
<input
    type="email"
    id="email"
    name="email"
    autocomplete="email"
    required
>

               <label for="nascimento">Data de nascimento (obrigatório):</label>
<input
    type="date"
    id="nascimento"
    name="nascimento"
    autocomplete="bday"
    required
>
                <label for="cpf">CPF (obrigatório):</label>
                <input type="text"
                id="cpf"
                name="cpf"
                pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                placeholder="000.000.000-00"
                required>

               <label for="telefone">Telefone (obrigatório):</label>
                <input type="tel"
                id="telefone"
                name="telefone"
                pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                placeholder="(00) 00000-0000"
                required>
            
            </fieldset>    


            <fieldset>
                <legend>Endereço</legend>

                <label for="endereco">Endereço</label>
               <input type="text" id="endereco" name="endereco" autocomplete="street-address">
 
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade" autocomplete="address-level2">

                <label for="estado">Estado</label>
                <input type="text" id="estado" name="estado" autocomplete="address-level1">
               <label for="cep">CEP (obrigatório):</label>
<input type="text"
    id="cep"
    name="cep"
    pattern="[0-9]{5}-[0-9]{3}"
    placeholder="00000-000"
    autocomplete="postal-code"
    required>
            </fieldset>
            <button type="submit">cadastrar</button>
        </form>
    </main>
    <footer>
        <p>Projeto desenvolvido para a disciplina de Desenvolvimento Front-End para Web.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/script.js"></script>
</body>
</html>
