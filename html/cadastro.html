<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Projeto ONG</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Cadastro do Colaborador</h1>
    </header>

    <nav class="menu">
    <button class="menu-toggle" type="button" aria-label="Abrir menu">
        ☰
    </button>

    <div class="menu-links">
        <a href="index.html">Início</a>

<div class="dropdown">
    <a href="projetos.html">Projetos</a>
    <div class="dropdown-conteudo">
        <a href="projetos.html">Doações</a>
        <a href="projetos.html">Voluntariado</a>
    </div>
</div>

<a href="cadastro.html">Cadastro</a>
    </nav>

    <main>
        <h2>Faça parte da nossa ONG</h2>
        <form>
            <fieldset>
                <legend>Dados pessoais</legend>
                
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento">
                <label for="cpf">CPF:</label>
                <input type="text"
                id="cpf"
                name="cpf"
                pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                placeholder="000.000.000-00"
                required>

                <label for="telefone">Telefone:</label>
                <input type="tel"
                id="telefone"
                name="telefone"
                pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                placeholder="(00) 00000-0000"
                required>
            
            </fieldset>    


            <fieldset>
                <legend>Endereço</legend>

                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco">
 
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade">

                <label for="estado">Estado</label>
                <input type="text" id="estado" name="estado">

                <label for="cep">CEP:</label>
                <input type="text"
                id="cep"
                name="cep"
                pattern="[0-9]{5}-[0-9]{3}"
                placeholder="00000-000"
                required>

            </fieldset>
            <button type="submit">cadastrar</button>
        </form>
    </main>
    <footer>
        <p>Projeto desenvolvido para a disciplina de Desenvolvimento Front-End para Web.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/script.js"></script>
</body>
</html>
